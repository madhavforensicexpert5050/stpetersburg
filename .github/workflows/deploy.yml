# Builds the StageLiora public preview and deploys it to GitHub Pages:
#   https://madhavforensicexpert5050.github.io/stpetersburg/
#
# This is a noindex preview, not a production release. It runs "npm run build:github-pages", which:
#   - sets DEPLOY_TARGET=github-pages (site/base for the /stpetersburg/ subpath),
#   - leaves out disabled, legal-draft and quote routes,
#   - validates the real output (links, assets, noindex, canonical host, no internal notes),
#   - deletes the output and fails if any check fails.
# Production releases for st.petersburg.stageliora.com still go through "npm run build:production".
#
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A queued run waits rather than cancelling one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Static QA and release-gate matrix
        run: npm run qa

      - name: Build and validate the GitHub Pages preview
        run: npm run build:github-pages

      - name: Confirm the artifact is the real site
        run: |
          test -f dist-github-pages/index.html
          test -d dist-github-pages/_astro
          grep -q '<header class="site-header"' dist-github-pages/index.html
          grep -q 'href="/stpetersburg/about/"' dist-github-pages/index.html
          grep -q '<meta name="robots" content="noindex' dist-github-pages/index.html
          echo "Routes in artifact: $(find dist-github-pages -name index.html | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-github-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report the deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
